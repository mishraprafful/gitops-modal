apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: modaldeployments.modal.io
  labels:
    app: modal-operator
spec:
  group: modal.io
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - appName
                - source
              properties:
                appName:
                  type: string
                  description: 'Name of the Modal application'
                  pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
                description:
                  type: string
                  description: 'Description of the Modal application'
                source:
                  type: object
                  description: 'Source configuration for the Modal app'
                  oneOf:
                    - required: ['git']
                    - required: ['image']
                  properties:
                    git:
                      type: object
                      required:
                        - repository
                        - path
                      properties:
                        repository:
                          type: string
                          description: 'Git repository URL'
                        branch:
                          type: string
                          description: 'Git branch (default: main)'
                          default: 'main'
                        path:
                          type: string
                          description: 'Path to the Modal app file within the repository'
                        revision:
                          type: string
                          description: 'Git commit SHA or tag'
                        credentials:
                          type: object
                          description: 'Credentials for accessing private repositories'
                          properties:
                            secretRef:
                              type: object
                              required:
                                - name
                              properties:
                                name:
                                  type: string
                                  description: 'Name of Kubernetes secret containing git credentials'
                                namespace:
                                  type: string
                                  description: 'Namespace of the secret (defaults to deployment namespace)'
                    image:
                      type: object
                      required:
                        - name
                      properties:
                        name:
                          type: string
                          description: 'Container image name'
                        tag:
                          type: string
                          description: 'Image tag'
                          default: 'latest'
                        pullSecret:
                          type: string
                          description: 'Kubernetes secret for pulling private images'
                environment:
                  type: object
                  description: 'Environment configuration'
                  properties:
                    name:
                      type: string
                      description: 'Modal environment name'
                      enum: ['main', 'dev', 'staging', 'prod']
                      default: 'main'
                    variables:
                      type: object
                      description: 'Environment variables'
                      additionalProperties:
                        type: string
                    secrets:
                      type: array
                      description: 'List of secrets to inject'
                      items:
                        type: object
                        required:
                          - name
                        properties:
                          name:
                            type: string
                            description: 'Name of the Modal secret'
                          key:
                            type: string
                            description: 'Kubernetes secret key'
                          secretRef:
                            type: object
                            description: 'Reference to Kubernetes secret'
                            required:
                              - name
                            properties:
                              name:
                                type: string
                                description: 'Name of Kubernetes secret'
                              namespace:
                                type: string
                                description: 'Namespace of the secret'
            status:
              type: object
              properties:
                phase:
                  type: string
                  description: 'Current phase of the deployment'
                  enum: ['Pending', 'Deploying', 'Ready', 'Failed', 'Terminating']
                conditions:
                  type: array
                  description: 'List of conditions'
                  items:
                    type: object
                    required:
                      - type
                      - status
                    properties:
                      type:
                        type: string
                        description: 'Type of condition'
                      status:
                        type: string
                        description: 'Status of condition'
                        enum: ['True', 'False', 'Unknown']
                      reason:
                        type: string
                        description: 'Machine-readable reason'
                      message:
                        type: string
                        description: 'Human-readable message'
                      lastTransitionTime:
                        type: string
                        format: date-time
                        description: 'Last transition time'
                modalAppId:
                  type: string
                  description: 'Modal application ID'
                url:
                  type: string
                  description: 'Application URL if web app'
                lastDeployment:
                  type: string
                  format: date-time
                  description: 'Timestamp of last deployment'
                observedGeneration:
                  type: integer
                  description: 'Generation of spec that was last processed'
      additionalPrinterColumns:
        - name: App Name
          type: string
          description: Modal application name
          jsonPath: .spec.appName
        - name: Phase
          type: string
          description: Current deployment phase
          jsonPath: .status.phase
        - name: Environment
          type: string
          description: Modal environment
          jsonPath: .spec.environment.name
        - name: URL
          type: string
          description: Application URL
          jsonPath: .status.url
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
  scope: Namespaced
  names:
    plural: modaldeployments
    singular: modaldeployment
    kind: ModalDeployment
    shortNames:
      - md
      - modal
