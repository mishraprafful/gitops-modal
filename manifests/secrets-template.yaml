apiVersion: v1
kind: Secret
metadata:
  name: modal-credentials
  namespace: modal-system
  labels:
    app.kubernetes.io/name: modal-operator
    app.kubernetes.io/component: credentials
type: Opaque
data:
  # Base64 encoded Modal credentials
  # Replace these with your actual Modal token ID and secret
  token-id: '' # echo -n "your-modal-token-id" | base64
  token-secret: '' # echo -n "your-modal-token-secret" | base64
---
apiVersion: v1
kind: Secret
metadata:
  name: modal-registry-credentials
  namespace: modal-system
  labels:
    app.kubernetes.io/name: modal-operator
    app.kubernetes.io/component: registry
type: kubernetes.io/dockerconfigjson
data:
  # Docker registry credentials for pulling operator image
  .dockerconfigjson: '' # Base64 encoded Docker config JSON
