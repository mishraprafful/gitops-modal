# ArgoCD Health Check Configuration for ModalDeployment CRD
#
# This ConfigMap patch adds custom health check logic for ModalDeployment resources.
# Apply this to your ArgoCD installation to enable proper health status reporting.
#
# Usage:
#   kubectl apply -f manifests/argocd-health-check.yaml
#   # Or use: make install-argocd-config
#
# After applying, restart argocd-server if needed:
#   kubectl rollout restart deployment argocd-server -n argocd
#
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-cm
    app.kubernetes.io/part-of: argocd
data:
  # Custom health check for ModalDeployment resources
  # Maps ModalDeployment status to ArgoCD health states:
  #   - Healthy: Ready condition is True
  #   - Progressing: Reconciling condition is True
  #   - Degraded: Stalled condition is True or phase is Failed
  #   - Unknown: No status information available
  resource.customizations.health.modal.io_ModalDeployment: |
    hs = {}
    if obj.status ~= nil then
      -- Check conditions first (preferred method)
      if obj.status.conditions ~= nil then
        for i, condition in ipairs(obj.status.conditions) do
          -- Check for Stalled condition first (takes precedence)
          if condition.type == "Stalled" and condition.status == "True" then
            hs.status = "Degraded"
            hs.message = condition.message or "Modal deployment is stalled"
            return hs
          end
        end
        for i, condition in ipairs(obj.status.conditions) do
          -- Check for Ready condition
          if condition.type == "Ready" and condition.status == "True" then
            hs.status = "Healthy"
            hs.message = condition.message or "Modal deployment is ready"
            return hs
          end
        end
        for i, condition in ipairs(obj.status.conditions) do
          -- Check for Reconciling condition
          if condition.type == "Reconciling" and condition.status == "True" then
            hs.status = "Progressing"
            hs.message = condition.message or "Deployment in progress"
            return hs
          end
        end
      end
      -- Fall back to phase field for backward compatibility
      if obj.status.phase == "Ready" then
        hs.status = "Healthy"
        hs.message = "Modal deployment is ready"
      elseif obj.status.phase == "Deploying" or obj.status.phase == "Pending" then
        hs.status = "Progressing"
        hs.message = "Deployment in progress"
      elseif obj.status.phase == "Failed" then
        hs.status = "Degraded"
        hs.message = "Deployment failed"
      elseif obj.status.phase == "Terminating" then
        hs.status = "Progressing"
        hs.message = "Terminating"
      else
        hs.status = "Unknown"
        hs.message = "Unknown phase: " .. (obj.status.phase or "nil")
      end
    else
      hs.status = "Progressing"
      hs.message = "Waiting for status"
    end
    return hs

  # Ignore transient status fields to prevent unnecessary reconciliation
  # This prevents ArgoCD from detecting "drift" on fields that change frequently
  resource.customizations.ignoreResourceUpdates.modal.io_ModalDeployment: |
    jsonPointers:
      - /status/lastDeployment
      - /status/conditions/0/lastTransitionTime
      - /status/conditions/1/lastTransitionTime
      - /status/conditions/2/lastTransitionTime
      - /status/conditions/3/lastTransitionTime
