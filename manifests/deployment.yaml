apiVersion: apps/v1
kind: Deployment
metadata:
  name: modal-operator
  namespace: modal-system
  labels:
    app.kubernetes.io/name: modal-operator
    app.kubernetes.io/component: controller
    app.kubernetes.io/version: 'v1.0.0'
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: modal-operator
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: modal-operator
        app.kubernetes.io/component: controller
        app.kubernetes.io/version: 'v1.0.0'
      annotations:
        kubectl.kubernetes.io/default-container: operator
    spec:
      serviceAccountName: modal-operator
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
      containers:
        - name: operator
          image: modal-operator:latest
          imagePullPolicy: IfNotPresent
          command:
            - python
            - main.py
          env:
            - name: WATCH_NAMESPACE
              value: '' # Empty means watch all namespaces
            - name: LOG_LEVEL
              value: 'INFO'
            - name: MODAL_TOKEN_ID
              valueFrom:
                secretKeyRef:
                  name: modal-credentials
                  key: token-id
            - name: MODAL_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: modal-credentials
                  key: token-secret
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      nodeSelector:
        kubernetes.io/os: linux
      tolerations:
        - key: 'node-role.kubernetes.io/master'
          operator: 'Exists'
          effect: 'NoSchedule'
        - key: 'node-role.kubernetes.io/control-plane'
          operator: 'Exists'
          effect: 'NoSchedule'
---
apiVersion: v1
kind: Service
metadata:
  name: modal-operator-metrics
  namespace: modal-system
  labels:
    app.kubernetes.io/name: modal-operator
    app.kubernetes.io/component: metrics
spec:
  selector:
    app.kubernetes.io/name: modal-operator
    app.kubernetes.io/component: controller
  ports:
    - name: metrics
      port: 8080
      targetPort: metrics
      protocol: TCP
    - name: health
      port: 8081
      targetPort: health
      protocol: TCP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: modal-operator-config
  namespace: modal-system
  labels:
    app.kubernetes.io/name: modal-operator
    app.kubernetes.io/component: config
data:
  config.yaml: |
    operator:
      watchNamespace: ""
      logLevel: "INFO"
      metricsAddr: ":8080"
      healthAddr: ":8081"
      leaderElection: true
    modal:
      environment: "main"
      defaultTimeout: 300
      maxRetries: 3
    deployment:
      defaultStrategy: "rolling"
      healthCheckEnabled: true
      healthCheckTimeout: 30
