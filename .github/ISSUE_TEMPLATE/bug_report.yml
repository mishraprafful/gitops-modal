name: Bug Report
description: File a bug report to help us improve
title: "bug: "
labels: ["bug", "triage"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! Please provide as much detail as possible.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Tell us what happened
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. Deploy ModalDeployment with '...'
        2. Run kubectl command '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen
      placeholder: Describe what should have happened
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened
      placeholder: Describe what actually happened
    validations:
      required: true

  - type: textarea
    id: yaml
    attributes:
      label: ModalDeployment YAML
      description: Please provide the ModalDeployment resource YAML (sanitize any secrets)
      render: yaml
      placeholder: |
        apiVersion: modal.io/v1
        kind: ModalDeployment
        metadata:
          name: my-app
        spec:
          ...

  - type: textarea
    id: logs
    attributes:
      label: Operator Logs
      description: |
        Relevant operator logs. Get them with:
        `kubectl logs -n modal-system -l app.kubernetes.io/name=modal-operator --tail=100`
      render: shell
      placeholder: Paste operator logs here

  - type: input
    id: version
    attributes:
      label: Operator Version
      description: What version of the operator are you running?
      placeholder: "e.g., v1.0.0, main@abc1234"
    validations:
      required: true

  - type: input
    id: k8s-version
    attributes:
      label: Kubernetes Version
      description: What version of Kubernetes are you using?
      placeholder: "e.g., 1.28.0"
    validations:
      required: true

  - type: dropdown
    id: k8s-platform
    attributes:
      label: Kubernetes Platform
      description: What Kubernetes platform are you using?
      options:
        - kind
        - minikube
        - GKE (Google Kubernetes Engine)
        - EKS (Amazon Elastic Kubernetes Service)
        - AKS (Azure Kubernetes Service)
        - Other
    validations:
      required: true

  - type: input
    id: modal-version
    attributes:
      label: Modal CLI Version
      description: What version of Modal CLI is in the operator?
      placeholder: "e.g., 0.63.0"

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any other context about the problem here
      placeholder: Screenshots, related issues, etc.

  - type: checkboxes
    id: terms
    attributes:
      label: Pre-submission Checklist
      description: Please verify the following before submitting
      options:
        - label: I have searched existing issues to avoid duplicates
          required: true
        - label: I have provided all requested information
          required: true
        - label: I have sanitized any sensitive information from logs and configs
          required: true
