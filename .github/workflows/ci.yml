name: CI

# Required GitHub Secrets:
#   MODAL_TOKEN_ID: Modal API token ID
#   MODAL_TOKEN_SECRET: Modal API token secret
#
# These secrets must be configured in GitHub repository settings:
# Settings > Secrets and variables > Actions > New repository secret

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
    # Allow manual trigger

env:
  KIND_CLUSTER_NAME: modal-test-cluster
  OPERATOR_NAMESPACE: modal-system

jobs:
  # Stage 0: Linting
  # Purpose: Run code quality checks (Python, YAML, Markdown)
  # Runs in parallel with e2e-test for faster feedback
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pre-commit
        run: |
          pip install pre-commit

      - name: Run pre-commit hooks
        run: |
          pre-commit run --all-files

  # Stage 2: E2E Test
  # Purpose: Build Docker image, create kind cluster, install operator, and run E2E tests
  # All steps run on the same VM to:
  #   - Build image once (avoid rebuilding)
  #   - Share the kind cluster across all operations
  #   - Run all tests sequentially for better failure isolation
  # Runs in parallel with lint (no dependency)
  e2e-test:
    name: E2E Test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Install kind
        uses: helm/kind-action@v1.8.0
        with:
          install_only: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (includes unit tests)
        working-directory: operator
        run: |
          docker build -t modal-operator:test -f Dockerfile .
          echo "✅ Docker image built successfully"
          echo "✅ Unit tests passed during Docker build"

      - name: Verify Modal package in image
        run: |
          docker run --rm modal-operator:test python -c "import modal; print('✓ Modal package imported successfully')"

      - name: Create kind cluster
        run: |
          kind create cluster \
            --name ${{ env.KIND_CLUSTER_NAME }} \
            --wait 300s \
            --config - <<EOF
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          nodes:
          - role: control-plane
            kubeadmConfigPatches:
            - |
              kind: InitConfiguration
              nodeRegistration:
                kubeletExtraArgs:
                  node-labels: "ingress-ready=true"
          EOF
          echo "✅ Kind cluster created successfully"

      - name: Wait for cluster to be ready
        run: |
          mkdir -p $HOME/.kube
          kind get kubeconfig --name ${{ env.KIND_CLUSTER_NAME }} > $HOME/.kube/config
          kubectl cluster-info --context kind-${{ env.KIND_CLUSTER_NAME }}
          kubectl wait --for=condition=Ready nodes --all --timeout=300s
          echo "✅ Kind cluster is ready"

      - name: Load Docker image into kind
        run: |
          kind load docker-image modal-operator:test --name ${{ env.KIND_CLUSTER_NAME }}
          echo "✅ Docker image loaded into kind cluster"

      - name: Install operator using make install
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          IMAGE: modal-operator:test
        run: |
          # Make install will:
          # - Update deployment.yaml with the image we built
          # - Install CRD, RBAC, and operator deployment
          # - Create Modal credentials secret
          # - Wait for operator to be ready
          # Note: We use make install (not make deploy) to avoid rebuilding the image
          make install IMAGE=modal-operator:test
          echo "✅ Operator installed successfully"

      - name: Verify CRD installation
        run: |
          kubectl get crd modaldeployments.modal.io
          echo "✅ CRD is installed"

      - name: Verify operator pod is running
        run: |
          kubectl wait --for=condition=available --timeout=300s \
            deployment/modal-operator -n ${{ env.OPERATOR_NAMESPACE }}
          kubectl get pods -n ${{ env.OPERATOR_NAMESPACE }} -l app.kubernetes.io/name=modal-operator
          echo "✅ Operator pod is running"

      - name: Check operator logs for errors
        continue-on-error: true
        run: |
          echo "Checking operator logs..."
          kubectl logs -n ${{ env.OPERATOR_NAMESPACE }} \
            -l app.kubernetes.io/name=modal-operator --tail=50

      # E2E Testing: Deploy example ModalDeployments and verify they work
      - name: Test function-deployment.yaml
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          echo "Deploying function-deployment.yaml..."
          kubectl apply -f examples/function-deployment.yaml

          # Wait for CRD to have status
          echo "Waiting for deployment to be processed..."
          timeout=300
          elapsed=0
          while [ $elapsed -lt $timeout ]; do
            status=$(kubectl get modaldeployment hello-world-function -o jsonpath='{.status.phase}' 2>/dev/null || echo "")
            if [ -n "$status" ]; then
              echo "Deployment status: $status"
              break
            fi
            sleep 5
            elapsed=$((elapsed + 5))
          done

          # Check for Modal app ID in status
          modal_app_id=$(kubectl get modaldeployment hello-world-function -o jsonpath='{.status.modalAppId}' 2>/dev/null || echo "")
          if [ -n "$modal_app_id" ]; then
            echo "✅ Modal app ID found: $modal_app_id"
          else
            echo "⚠️  Modal app ID not yet set (may be in progress)"
          fi

          # Check for error conditions
          conditions=$(kubectl get modaldeployment hello-world-function -o jsonpath='{.status.conditions}' 2>/dev/null || echo "[]")
          echo "Conditions: $conditions"

          # Verify deployment exists
          kubectl get modaldeployment hello-world-function
          echo "✅ function-deployment.yaml test completed"

      - name: Test modal-examples-hello-world.yaml
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          echo "Deploying modal-examples-hello-world.yaml..."
          kubectl apply -f examples/modal-examples-hello-world.yaml

          # Wait for CRD to have status
          echo "Waiting for deployment to be processed..."
          timeout=300
          elapsed=0
          while [ $elapsed -lt $timeout ]; do
            status=$(kubectl get modaldeployment modal-hello-world -o jsonpath='{.status.phase}' 2>/dev/null || echo "")
            if [ -n "$status" ]; then
              echo "Deployment status: $status"
              break
            fi
            sleep 5
            elapsed=$((elapsed + 5))
          done

          # Check for Modal app ID in status
          modal_app_id=$(kubectl get modaldeployment modal-hello-world -o jsonpath='{.status.modalAppId}' 2>/dev/null || echo "")
          if [ -n "$modal_app_id" ]; then
            echo "✅ Modal app ID found: $modal_app_id"
          else
            echo "⚠️  Modal app ID not yet set (may be in progress)"
          fi

          # Verify deployment exists
          kubectl get modaldeployment modal-hello-world
          echo "✅ modal-examples-hello-world.yaml test completed"

      - name: Test gpu-job-deployment.yaml (optional)
        continue-on-error: true
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          echo "Deploying gpu-job-deployment.yaml..."
          kubectl apply -f examples/gpu-job-deployment.yaml

          # Wait for CRD to have status
          echo "Waiting for deployment to be processed..."
          timeout=300
          elapsed=0
          while [ $elapsed -lt $timeout ]; do
            status=$(kubectl get modaldeployment modal-gpu-hello-world -o jsonpath='{.status.phase}' 2>/dev/null || echo "")
            if [ -n "$status" ]; then
              echo "Deployment status: $status"
              break
            fi
            sleep 5
            elapsed=$((elapsed + 5))
          done

          # Verify GPU configuration in status or logs
          kubectl get modaldeployment modal-gpu-hello-world -o yaml
          echo "✅ gpu-job-deployment.yaml test completed"

      - name: Collect operator logs
        if: always()
        continue-on-error: true
        run: |
          echo "Collecting operator logs..."
          kubectl logs -n ${{ env.OPERATOR_NAMESPACE }} \
            -l app.kubernetes.io/name=modal-operator --tail=100 > operator-logs.txt

          echo "Collecting all ModalDeployment resources..."
          kubectl get modaldeployments -o yaml > all-deployments.yaml

      - name: Upload logs as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            operator-logs.txt
            all-deployments.yaml
          retention-days: 7

      - name: Cleanup test resources and cluster
        if: always()
        run: |
          echo "Cleaning up test resources..."
          kubectl delete modaldeployment hello-world-function --ignore-not-found=true || true
          kubectl delete modaldeployment modal-hello-world --ignore-not-found=true || true
          kubectl delete modaldeployment modal-gpu-hello-world --ignore-not-found=true || true
          echo "✅ Test resources cleaned up"

          echo "Cleaning up kind cluster..."
          if kind get clusters | grep -q "${{ env.KIND_CLUSTER_NAME }}"; then
            kind delete cluster --name ${{ env.KIND_CLUSTER_NAME }}
            echo "✅ Kind cluster deleted"
          else
            echo "Cluster already deleted or doesn't exist"
          fi
