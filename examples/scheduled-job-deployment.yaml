apiVersion: modal.io/v1
kind: ModalDeployment
metadata:
  name: daily-data-pipeline
  namespace: data-ops
  labels:
    app: data-pipeline
    type: scheduled
spec:
  appName: daily-data-pipeline
  description: 'Daily data processing pipeline'
  source:
    git:
      repository: 'https://github.com/your-org/data-pipelines'
      branch: 'main'
      path: 'pipelines/daily_etl.py'
  environment:
    name: 'prod'
    variables:
      S3_BUCKET: 'data-lake-bucket'
      PROCESSING_MODE: 'batch'
    secrets:
      - name: 'aws-credentials'
        secretRef:
          name: 'aws-secret'
          namespace: 'data-ops'
      - name: 'database-url'
        secretRef:
          name: 'db-secret'
          namespace: 'data-ops'
  compute:
    cpu: '2'
    memory: '4Gi'
    timeout: 3600 # 1 hour
  scaling:
    minInstances: 0
    maxInstances: 1
    concurrency: 1
  schedule:
    cron: '0 2 * * *' # Daily at 2 AM
    timezone: 'UTC'
  deployment:
    strategy: 'replace'
    healthCheck:
      enabled: false
