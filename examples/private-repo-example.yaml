# Example: Deploying from a Private Git Repository
# This example shows how to deploy a Modal app from a private repository
# using either SSH keys or Personal Access Tokens

---
# Example 1: Using SSH Key Authentication
apiVersion: modal.io/v1
kind: ModalDeployment
metadata:
  name: private-repo-ssh
  labels:
    app: private-app
    auth-type: ssh
spec:
  appName: private-repo-ssh-app
  description: 'Modal app from private repository using SSH key'
  source:
    git:
      repository: 'git@github.com:YOUR-ORG/private-modal-app.git'
      branch: 'main'
      path: 'app.py'
      credentials:
        secretRef:
          name: 'git-ssh-credentials'
          # namespace: 'default'  # Optional: defaults to deployment namespace
  environment:
    name: 'main'

---
# Example 2: Using Personal Access Token (PAT)
apiVersion: modal.io/v1
kind: ModalDeployment
metadata:
  name: private-repo-pat
  labels:
    app: private-app
    auth-type: pat
spec:
  appName: private-repo-pat-app
  description: 'Modal app from private repository using PAT'
  source:
    git:
      repository: 'https://github.com/YOUR-ORG/private-modal-app.git'
      branch: 'main'
      path: 'app.py'
      credentials:
        secretRef:
          name: 'git-pat-credentials'
  environment:
    name: 'main'

---
# How to create the SSH key secret:
#
# 1. Generate an SSH key (if you don't have one):
#    ssh-keygen -t ed25519 -C "your_email@example.com" -f ~/.ssh/modal_deploy_key
#
# 2. Add the public key to your Git provider:
#    - GitHub: Settings > SSH and GPG keys > New SSH key
#    - GitLab: Settings > SSH Keys
#    - Paste contents of ~/.ssh/modal_deploy_key.pub
#
# 3. Create the Kubernetes secret:
#    kubectl create secret generic git-ssh-credentials \
#      --from-file=ssh-privatekey=$HOME/.ssh/modal_deploy_key
#
# 4. Deploy:
#    kubectl apply -f private-repo-example.yaml

---
# How to create the Personal Access Token secret:
#
# 1. Generate a Personal Access Token:
#    - GitHub: Settings > Developer settings > Personal access tokens > Tokens (classic)
#      Scopes needed: repo (full control of private repositories)
#    - GitLab: User Settings > Access Tokens
#      Scopes needed: read_repository
#
# 2. Create the Kubernetes secret:
#    kubectl create secret generic git-pat-credentials \
#      --from-literal=token=ghp_your_github_token_here
#
#    # For GitLab:
#    kubectl create secret generic git-pat-credentials \
#      --from-literal=token=glpat-your_gitlab_token_here
#
# 3. Deploy:
#    kubectl apply -f private-repo-example.yaml

---
# Notes:
# - SSH authentication is recommended for maximum security
# - Personal Access Tokens work with HTTPS URLs
# - SSH URLs start with: git@github.com:
# - HTTPS URLs start with: https://github.com/
# - The secret can be in any namespace, specify with credentials.secretRef.namespace
# - Secrets are mounted read-only and cleaned up after cloning
