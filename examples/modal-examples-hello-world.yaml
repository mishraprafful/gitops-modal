apiVersion: modal.io/v1
kind: ModalDeployment
metadata:
  name: modal-hello-world
  labels:
    app: hello-world
    type: function
spec:
  appName: modal-hello-world
  description: "Hello world Modal function using public repository"
  source:
    # Using Modal's official examples repository
    git:
      repository: 'https://github.com/modal-labs/modal-examples'
      branch: 'main'
      path: '01_getting_started/hello_world.py'
  environment:
    name: "main"
    variables:
      LOG_LEVEL: "INFO"
  compute:
    cpu: "0.25"
    memory: "512Mi"
    timeout: 60
  scaling:
    minInstances: 0
    maxInstances: 5
    concurrency: 1
    idleTimeout: 300
  deployment:
    strategy: "rolling"
    healthCheck:
      enabled: true
      timeout: 30
