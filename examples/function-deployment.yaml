apiVersion: modal.io/v1
kind: ModalDeployment
metadata:
  name: hello-world-function
  labels:
    app: hello-world
    type: function
spec:
  appName: hello-world-function
  description: 'A simple hello world Modal function'
  source:
    # Option 1: Use a real public repository (update with your repo)
    # git:
    #   repository: 'https://github.com/modal-labs/modal-examples'
    #   branch: 'main'
    #   path: 'hello_world.py'

    # Option 2: Use container image (recommended for testing)
    image:
      name: 'python'
      tag: '3.11-slim'
  environment:
    name: 'main'
    variables:
      LOG_LEVEL: 'INFO'
      GREETING: 'Hello from GitOps!'
  compute:
    cpu: '0.25'
    memory: '512Mi'
    timeout: 60
  scaling:
    minInstances: 0
    maxInstances: 10
    concurrency: 1
    idleTimeout: 300
  deployment:
    strategy: 'rolling'
    healthCheck:
      enabled: true
      timeout: 30
