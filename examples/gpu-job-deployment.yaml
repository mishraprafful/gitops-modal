apiVersion: modal.io/v1
kind: ModalDeployment
metadata:
  name: gpu-stable-diffusion
  labels:
    app: stable-diffusion
    type: gpu-job
spec:
  appName: gpu-stable-diffusion
  description: 'Stable Diffusion GPU job'
  source:
    git:
      repository: 'https://github.com/modal-labs/modal-examples'
      branch: 'main'
      path: '06_gpu_and_ml/stable_diffusion/stable_diffusion_xl_turbo.py'
  environment:
    name: 'main'
    variables:
      MODEL_NAME: 'stabilityai/sdxl-turbo'
