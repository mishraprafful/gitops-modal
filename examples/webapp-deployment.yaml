apiVersion: modal.io/v1
kind: ModalDeployment
metadata:
  name: fastapi-web-app
  namespace: default
  labels:
    app: fastapi-web
    type: webapp
spec:
  appName: fastapi-web-app
  description: 'FastAPI web application deployed on Modal'
  source:
    git:
      repository: 'https://github.com/your-org/modal-apps'
      branch: 'main'
      path: 'web/fastapi_app.py'
  environment:
    name: 'main'
    variables:
      DATABASE_URL: 'postgresql://...'
      REDIS_URL: 'redis://...'
    secrets:
      - name: 'db-credentials'
        secretRef:
          name: 'database-secret'
          namespace: 'default'
      - name: 'api-keys'
        secretRef:
          name: 'api-secret'
          namespace: 'default'
  compute:
    cpu: '1'
    memory: '1Gi'
    timeout: 300
  scaling:
    minInstances: 1
    maxInstances: 50
    concurrency: 10
    idleTimeout: 600
  webhooks:
    enabled: true
    path: '/'
    methods: ['GET', 'POST', 'PUT', 'DELETE']
  deployment:
    strategy: 'rolling'
    healthCheck:
      enabled: true
      path: '/health'
      timeout: 30
